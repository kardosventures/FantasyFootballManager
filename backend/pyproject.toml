[project]
name = "fantasy-operations-backend"
version = "0.1.0"
description = "Sleeper fantasy football operations monitor"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "apscheduler>=3.11,<4",
  "asyncpg>=0.30,<1",
  "fastapi>=0.140,<1",
  "greenlet>=3.1,<4",
  "httpx>=0.28,<1",
  "pillow>=11.3,<12",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-json-logger>=3.3,<4",
  "sqlalchemy>=2.0.52,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "UP017"]
